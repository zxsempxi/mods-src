plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.1'
group = 'com.gearinventory'
base { archivesName = 'gearinventory' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies {
    implementation files('libs/curios-neoforge-9.5.1+1.21.1.jar')
    compileOnly files('libs/sophisticatedbackpacks-1.21.1-3.26.12.2208.jar', 'libs/sophisticatedcore-1.21.1-1.5.13.2404.jar')
    if (project.hasProperty('withCorpse')) { runtimeOnly files('libs/corpse-neoforge-1.21.1-1.1.21.jar') }
    compileOnly files('libs/tacz-neoforge-1.21.1-1.2.0-hotfix.jar')
    if (project.hasProperty('withTacz')) { runtimeOnly files('libs/tacz-neoforge-1.21.1-1.2.0-hotfix.jar') }
    if (project.hasProperty('withJei')) { runtimeOnly files('libs/jei-1.21.1-neoforge-19.64.0.455.jar') }
    if (project.hasProperty('withSB')) {
        runtimeOnly files('libs/sophisticatedbackpacks-1.21.1-3.26.12.2208.jar', 'libs/sophisticatedcore-1.21.1-1.5.13.2404.jar')
    }
}
neoForge {
    version = '21.1.262'
    runs {
        client { client(); gameDirectory = project.file('run-client'); programArguments.addAll '--username', 'GearTest', '--quickPlayMultiplayer', '127.0.0.1:25577' }
        client2 { client(); gameDirectory = project.file('run-client2'); programArguments.addAll '--username', 'GearTwo', '--quickPlayMultiplayer', '127.0.0.1:25579' }
        server { server(); gameDirectory = project.file('run-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'gearinventory'
        }
    }
    mods { gearinventory { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }